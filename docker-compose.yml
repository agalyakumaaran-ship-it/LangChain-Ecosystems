services:
  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    # Not published to the host by default. For debugging, uncomment:
    # ports:
    #   - "127.0.0.1:7474:7474"
    #   - "127.0.0.1:7687:7687"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      FAISS_PATH: /data/faiss
      AUTO_SYNC: ${AUTO_SYNC:-true}
    volumes:
      - faiss_data:/data/faiss
      - ./documents:/documents:ro   # put your PDFs here
    depends_on:
      neo4j:
        condition: service_healthy
    # Not published to the host: only the frontend talks to it. For debugging, uncomment:
    # ports:
    #   - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j_data:
  faiss_data:
